name: sharemap_maplibre_gl_example
publish_to: none
description: Minimal example app for the sharemap_maplibre_gl package.
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  sharemap_maplibre_gl:
    path: ..

dependency_overrides:
  sharemap_maplibre_gl_platform_interface:
    path: ../../maplibre_gl_platform_interface
  sharemap_maplibre_gl_web:
    path: ../../maplibre_gl_web

dev_dependencies:
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true
