name: maplibre_gl_workspace
publish_to: 'none'
repository: https://github.com/maplibre/flutter-maplibre-gl
issue_tracker: https://github.com/maplibre/flutter-maplibre-gl/issues

environment:
  sdk: '>=3.12.0 <4.0.0'

dev_dependencies:
  melos: ^7.4.0
  very_good_analysis: ^10.0.0

# Keep scripts outside the Flutter workspace: its `test` dependency needs a
# different analyzer/test_api set than flutter_test and Pigeon 29.1.0.
workspace:
  - maplibre_gl
  - maplibre_gl_web
  - maplibre_gl_example
  - maplibre_gl_platform_interface

melos:
  scripts:
    generate:
      description: Generate layer & source properties
      run: cd scripts && dart run lib/generate.dart

    generate:pigeon:
      description: Generate the Dart, Kotlin and Swift messages from pigeons/messages.dart
      # Formatted twice: on the long argument lists of the layer messages, one
      # pass of dart format leaves output that a second pass changes, which
      # would fail format-all right after generation.
      exec: dart run pigeon --input pigeons/messages.dart && dart format lib/src/native && dart format lib/src/native
      packageFilters:
        scope: sharemap_maplibre_gl

    check-style-spec:
      description: Verify input/style.json matches the pinned upstream MapLibre style spec
      run: cd scripts && dart run lib/check_style_spec.dart

    update-style-spec:
      description: Re-download input/style.json from the latest upstream style spec release
      run: cd scripts && dart run lib/check_style_spec.dart --update

    test:
      description: Run all tests
      run: |
        set -e
        dart run melos run test:io
        dart run melos run test:web
        dart run melos run test:scripts

    test:scripts:
      description: Run the code generator tests
      run: cd scripts && dart pub get && dart test

    test:io:
      description: Run IO tests
      exec: flutter test
      packageFilters:
        scope:
          - maplibre_gl_platform_interface
          - sharemap_maplibre_gl

    test:io:coverage:
      description: Run IO tests with coverage
      exec: flutter test --coverage
      packageFilters:
        scope:
          - maplibre_gl_platform_interface
          - sharemap_maplibre_gl

    test:web:
      description: Run Web tests
      exec: flutter test --platform chrome
      packageFilters:
        scope:
          - maplibre_gl_platform_interface
          - sharemap_maplibre_gl
          - maplibre_gl_web

    analyze-all:
      description: Run static analysis on all packages
      run: |
        set -e
        dart run melos exec --concurrency 10 -- "dart analyze --fatal-warnings --fatal-infos"
        cd scripts
        dart pub get
        dart analyze --fatal-warnings --fatal-infos

    format-all:
      description: Format all packages
      exec: dart format --set-exit-if-changed .

    fix-all:
      run: |
        set -e
        dart run melos exec --concurrency 10 -- "dart fix --apply"
        dart run melos exec --concurrency 10 -- "dart format -o write ."
        cd scripts
        dart fix --apply
        dart format -o write .
